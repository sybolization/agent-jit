# Agent JIT 的 DSH bundle patch 层：向 profile 树插入 DSL 插件行。
# 行 name 用包名 + 子路径（agent-jit/dsh → package.json exports），
# 安装后由 Node 从 profile 的 node_modules 解析；`--patch` 开发模式可
# 把 name 换成本仓库 dist 模块的绝对路径。
- insert:
    - id: agent-jit-dsl
      name: agent-jit/dsh
      config:
        # 实验模式：true 才注册实验业务工具（github_*/crm_*/users_*/email_*，
        # 供 R5/R6 benchmark 与演示任务）。生产缺省 false——插件使用者只拿
        # jit_* 元工具，自己注册进 DSH 的工具经活视图零配置可被 DSL 编排。
        # experimentMode: false
        providers:
          github: mock
          domain: mock
        dsl:
          signatureInDescription: inline
          # 生产默认 = R7 T3：不挂 system prompt，jit_execute_program 工具描述
          # 自带 when/why trigger + 完整中性 DSL manual（service.*，无 benchmark 泄漏）。
          systemPrompt: false
          systemPromptReference: neutral
          guidance: primitive
          describeTools: true
          routingPrompt: tool-embedded
          describeDslReference: none
          # soft hook：某工具返回列表结果后，向下一次模型输入追加一条"考虑 JIT"
          # 的提醒（advisory，模型可忽略；每 agent 每回合最多一次）。缺省 on-list
          # 开启；显式 none 关闭。
          routingReminder: on-list
          routingReminderMinListLength: 2
        # DSL 程序可编排的 DSH 宿主工具。缺省（不写）= 自动发现全部已注册
        # 工具（describe 即用、零配置）；hostTools: [] 显式关闭；写名字数组 =
        # 白名单。黑名单见 excludeHostTools。
        # hostTools: []
        # excludeHostTools: []
